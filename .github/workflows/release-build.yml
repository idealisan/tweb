name: Build and upload release assets

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name }}
  CADDY_TARGETS: linux_amd64 linux_arm64 mac_amd64 mac_arm64 windows_amd64 windows_arm64

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changelog
        run: pnpm run generate-changelog

      - name: Build frontend
        run: pnpm exec vite build

      - name: Package build output
        run: tar -czf "tweb-${RELEASE_TAG}.tar.gz" dist

      - name: Resolve latest Caddy version
        id: caddy
        run: |
          set -euo pipefail
          caddy_tag="$(curl --fail --silent --show-error \
            https://api.github.com/repos/caddyserver/caddy/releases/latest | jq -r .tag_name)"
          echo "tag=${caddy_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${caddy_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download and extract Caddy binaries
        env:
          CADDY_TAG: ${{ steps.caddy.outputs.tag }}
          CADDY_VERSION: ${{ steps.caddy.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .release/caddy
          for target in $CADDY_TARGETS; do
            archive="caddy_${CADDY_VERSION}_${target}"
            if [[ "$target" == windows_* ]]; then
              archive="${archive}.zip"
            else
              archive="${archive}.tar.gz"
            fi
            curl --fail --location --silent --show-error \
              -o ".release/caddy/${archive}" \
              "https://github.com/caddyserver/caddy/releases/download/${CADDY_TAG}/${archive}"
            mkdir -p ".release/caddy/${target}"
            if [[ "$target" == windows_* ]]; then
              unzip -q ".release/caddy/${archive}" -d ".release/caddy/${target}"
            else
              tar -xzf ".release/caddy/${archive}" -C ".release/caddy/${target}"
            fi
          done

      - name: Package server bundles
        run: |
          set -euo pipefail
          mkdir -p .release/server
          for target in $CADDY_TARGETS; do
            if [[ "$target" == windows_* ]]; then
              caddy_binary=".release/caddy/${target}/caddy.exe"
            else
              caddy_binary=".release/caddy/${target}/caddy"
            fi
            bundle=".release/server/tweb-${RELEASE_TAG}-${target}"
            bash scripts/package_server_bundle.sh "$target" "$caddy_binary" dist "$bundle"
            if [[ "$target" == windows_* ]]; then
              (cd .release/server && zip -qr "${bundle##*/}.zip" "${bundle##*/}")
            else
              tar -czf "${bundle}.tar.gz" -C .release/server "${bundle##*/}"
            fi
          done

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            tweb-${{ github.ref_name }}.tar.gz
            .release/server/*

  docker-image:
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download prebuilt dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
